    - main [ref=e54]:
      - article [ref=e55]:
        - heading "AutoSDK 介绍" [level=1] [ref=e56]
        - paragraph [ref=e57]: AutoSDK 是嵌入式 iOS JavaScript 自动化引擎：宿主 App 内嵌 JavaScriptCore，加载内置 bootstrap， 把 257 个脚本函数（触摸、控件、图色、OCR、YOLO、文件、存储、HTTP、SQLite、线程、定位、相册、悬浮窗、TTS…） 交给 JS 脚本，通过 bridge 调原生能力。对标 EasyClick iOS / AScript iOS / TrollAutoScript / kuaijs。
        - generic [ref=e58]:
          - text: 内置 no-WDA（v1.17.0+ 唯一跨 App 路线）：不再依赖外部 WebDriverAgent Runner。
          - code [ref=e59]: AutoBuiltinAdapter
          - text: 用 IOHIDEvent 注入真实触摸、AXUIElement 系统级控件检索（毫秒级）、 SpringBoard/LSApplicationWorkspace 控制应用，全部私有符号运行时 dlopen/dlsym 解析、不链接私有框架， 能力缺失时
          - code [ref=e60]: auto.capabilities()
          - text: 如实降级报告。
        - heading "与同类产品对比" [level=2] [ref=e61]
