<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="AutoSDK iOS JavaScript 自动化开发文档：快速开始、可视化调试、选择器、实战与完整 API。">
<title>AutoSDK 开发文档</title>
<script>
try {
  const savedTheme = localStorage.getItem('autosdk-docs-theme');
  if (savedTheme) document.documentElement.dataset.theme = savedTheme;
} catch (_) {}
</script>
<style>
:root {
  color-scheme: light;
  --bg: #ffffff;
  --surface: #f8fafc;
  --surface-strong: #f1f5f9;
  --panel: #ffffff;
  --border: #e2e8f0;
  --border-strong: #cbd5e1;
  --text: #172033;
  --muted: #64748b;
  --subtle: #94a3b8;
  --brand: #2563eb;
  --brand-strong: #1d4ed8;
  --brand-soft: #eff6ff;
  --code: #0f172a;
  --code-text: #dbeafe;
  --success: #047857;
  --success-soft: #ecfdf5;
  --warning: #b45309;
  --warning-soft: #fffbeb;
  --danger: #b91c1c;
  --shadow: 0 16px 44px rgba(15, 23, 42, .12);
  --header-height: 64px;
  --sidebar-width: 272px;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0b1020;
  --surface: #11182a;
  --surface-strong: #182237;
  --panel: #11182a;
  --border: #24324a;
  --border-strong: #33445f;
  --text: #e5edf9;
  --muted: #9aa9bf;
  --subtle: #718198;
  --brand: #60a5fa;
  --brand-strong: #93c5fd;
  --brand-soft: #172554;
  --code: #050914;
  --code-text: #dbeafe;
  --success: #6ee7b7;
  --success-soft: #052e2b;
  --warning: #fbbf24;
  --warning-soft: #351c07;
  --danger: #fca5a5;
  --shadow: 0 18px 52px rgba(0, 0, 0, .35);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: calc(var(--header-height) + 22px); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.72 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}
button, input { font: inherit; }
button, a { -webkit-tap-highlight-color: transparent; }
a { color: var(--brand); }
a:hover { color: var(--brand-strong); }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--brand) 38%, transparent); outline-offset: 2px; }
.topbar {
  position: fixed;
  inset: 0 0 auto;
  z-index: 50;
  height: var(--header-height);
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 20px;
  border-bottom: 1px solid var(--border);
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(16px);
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: max-content;
  color: var(--text);
  text-decoration: none;
  font-size: 16px;
  font-weight: 750;
}
.brand-mark {
  display: grid;
  width: 31px;
  height: 31px;
  place-items: center;
  border-radius: 9px;
  color: #fff;
  background: linear-gradient(135deg, #2563eb, #06b6d4);
  font-size: 13px;
  letter-spacing: -.5px;
}
.version {
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 2px 8px;
  color: var(--muted);
  background: var(--surface);
  font-size: 11px;
  font-weight: 600;
}
.search {
  position: relative;
  width: min(560px, 46vw);
  margin: 0 auto;
}
.search input {
  width: 100%;
  height: 40px;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 0 72px 0 38px;
  background: var(--surface);
  color: var(--text);
  outline: none;
}
.search input:focus { border-color: var(--brand); background: var(--panel); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 14%, transparent); }
.search-icon { position: absolute; top: 9px; left: 12px; color: var(--muted); pointer-events: none; }
.shortcut {
  position: absolute;
  top: 9px;
  right: 10px;
  border: 1px solid var(--border);
  border-bottom-color: var(--border-strong);
  border-radius: 5px;
  padding: 0 7px;
  color: var(--subtle);
  background: var(--panel);
  font-size: 11px;
}
.search-results {
  position: absolute;
  top: 47px;
  left: 0;
  right: 0;
  display: none;
  max-height: min(520px, 70vh);
  overflow: auto;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--panel);
  box-shadow: var(--shadow);
}
.search-results.open { display: block; }
.search-result {
  display: grid;
  gap: 2px;
  padding: 10px 13px;
  border-bottom: 1px solid var(--border);
  color: var(--text);
  text-decoration: none;
}
.search-result:last-child { border-bottom: 0; }
.search-result:hover, .search-result.active { color: var(--text); background: var(--brand-soft); }
.search-result strong { font-size: 13.5px; }
.search-result span { overflow: hidden; color: var(--muted); font: 12px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace; text-overflow: ellipsis; white-space: nowrap; }
.search-empty { padding: 20px; color: var(--muted); text-align: center; }
.top-actions { display: flex; align-items: center; gap: 8px; }
.icon-button, .menu-button {
  display: grid;
  width: 38px;
  height: 38px;
  place-items: center;
  border: 1px solid var(--border);
  border-radius: 9px;
  color: var(--muted);
  background: var(--panel);
  cursor: pointer;
}
.icon-button:hover, .menu-button:hover { color: var(--text); border-color: var(--border-strong); }
.github-link {
  border-radius: 9px;
  padding: 8px 11px;
  color: var(--muted);
  text-decoration: none;
  font-size: 13px;
  font-weight: 600;
}
.github-link:hover { color: var(--text); background: var(--surface); }
.menu-button { display: none; }
.shell { min-height: 100vh; padding-top: var(--header-height); }
.sidebar {
  position: fixed;
  z-index: 40;
  top: var(--header-height);
  bottom: 0;
  left: 0;
  width: var(--sidebar-width);
  overflow: auto;
  border-right: 1px solid var(--border);
  background: var(--surface);
  padding: 18px 12px 36px;
}
.nav-group { margin-bottom: 18px; }
.nav-title {
  padding: 0 10px 6px;
  color: var(--subtle);
  font-size: 11px;
  font-weight: 750;
  letter-spacing: .09em;
  text-transform: uppercase;
}
.nav-link {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 36px;
  margin: 1px 0;
  border-radius: 8px;
  padding: 7px 10px;
  color: var(--muted);
  text-decoration: none;
  font-size: 13.5px;
}
.nav-link:hover { color: var(--text); background: var(--surface-strong); }
.nav-link.current { color: var(--brand-strong); background: var(--brand-soft); font-weight: 650; }
.nav-count { min-width: 25px; border-radius: 999px; padding: 0 6px; color: var(--subtle); background: var(--panel); font-size: 10px; text-align: center; }
.content {
  width: min(100%, 1080px);
  margin-left: var(--sidebar-width);
  padding: 30px 44px 90px;
}
.breadcrumb { display: flex; gap: 7px; margin-bottom: 18px; color: var(--subtle); font-size: 12px; }
.breadcrumb span + span::before { content: "/"; margin-right: 7px; color: var(--border-strong); }
.page { display: none; }
.page.current { display: block; }
.page-head { margin-bottom: 26px; }
.eyebrow { margin: 0 0 5px; color: var(--brand); font-size: 12px; font-weight: 750; letter-spacing: .06em; }
h1 { margin: 0 0 8px; font-size: clamp(28px, 4vw, 38px); line-height: 1.24; letter-spacing: -.025em; }
.lead { max-width: 760px; margin: 0; color: var(--muted); font-size: 16px; }
h2 { margin: 34px 0 13px; font-size: 21px; line-height: 1.35; letter-spacing: -.01em; }
h3 { margin: 24px 0 9px; font-size: 17px; }
p { margin: 10px 0; }
ul, ol { padding-left: 22px; }
li + li { margin-top: 5px; }
code {
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 1px 5px;
  color: var(--brand-strong);
  background: var(--surface);
  font: .88em/1.55 ui-monospace, SFMono-Regular, Consolas, monospace;
}
.code-block { position: relative; margin: 13px 0 18px; }
pre {
  margin: 0;
  overflow: auto;
  border: 1px solid #1e293b;
  border-radius: 12px;
  padding: 17px 18px;
  color: var(--code-text);
  background: var(--code);
  font: 13px/1.65 ui-monospace, SFMono-Regular, Consolas, monospace;
}
pre code { border: 0; padding: 0; color: inherit; background: none; font: inherit; }
.copy-button {
  position: absolute;
  top: 9px;
  right: 9px;
  border: 1px solid #334155;
  border-radius: 7px;
  padding: 4px 9px;
  color: #cbd5e1;
  background: #172033;
  cursor: pointer;
  font-size: 11px;
}
.copy-button:hover { color: #fff; border-color: #64748b; }
.callout { margin: 18px 0; border: 1px solid var(--border); border-left: 4px solid var(--brand); border-radius: 9px; padding: 12px 15px; background: var(--brand-soft); }
.callout.success { border-left-color: var(--success); background: var(--success-soft); }
.callout.warning { border-left-color: var(--warning); background: var(--warning-soft); }
.callout strong { display: block; margin-bottom: 3px; }
.steps { display: grid; gap: 12px; margin: 18px 0; counter-reset: docs-step; }
.step { position: relative; min-height: 54px; border: 1px solid var(--border); border-radius: 11px; padding: 13px 15px 13px 54px; background: var(--panel); counter-increment: docs-step; }
.step::before { content: counter(docs-step); position: absolute; top: 12px; left: 14px; display: grid; width: 27px; height: 27px; place-items: center; border-radius: 8px; color: #fff; background: var(--brand); font-size: 12px; font-weight: 750; }
.step strong { display: block; }
.step p { margin: 2px 0 0; color: var(--muted); font-size: 13.5px; }
.card-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: 15px 0; }
.info-card { border: 1px solid var(--border); border-radius: 11px; padding: 14px 15px; background: var(--panel); }
.info-card strong { display: block; margin-bottom: 4px; }
.info-card p { margin: 0; color: var(--muted); font-size: 13.5px; }
table { width: 100%; margin: 14px 0 20px; border-collapse: collapse; font-size: 13.5px; }
th, td { border: 1px solid var(--border); padding: 9px 11px; text-align: left; vertical-align: top; }
th { background: var(--surface); font-weight: 700; }
.api-toolbar { display: flex; align-items: center; gap: 10px; margin: 18px 0; }
.api-filter { flex: 1; min-width: 0; height: 38px; border: 1px solid var(--border); border-radius: 9px; padding: 0 12px; color: var(--text); background: var(--panel); outline: 0; }
.api-filter:focus { border-color: var(--brand); }
.secondary-button { min-height: 38px; border: 1px solid var(--border); border-radius: 9px; padding: 0 11px; color: var(--muted); background: var(--panel); cursor: pointer; font-size: 12px; }
.secondary-button:hover { color: var(--text); border-color: var(--border-strong); }
.api-jump { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px 16px; margin: 0 0 22px; padding: 13px 15px; border: 1px solid var(--border); border-radius: 11px; background: var(--surface); }
.api-jump a { overflow: hidden; padding: 3px 0; color: var(--muted); text-decoration: none; font: 12px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace; text-overflow: ellipsis; white-space: nowrap; }
.api-jump a:hover { color: var(--brand-strong); }
.api-entry { margin: 0 0 10px; border: 1px solid var(--border); border-radius: 11px; background: var(--panel); scroll-margin-top: calc(var(--header-height) + 16px); }
.api-entry[open] { border-color: var(--border-strong); box-shadow: 0 8px 24px rgba(15, 23, 42, .05); }
.api-entry > summary { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; align-items: center; padding: 13px 15px; cursor: pointer; list-style: none; }
.api-entry > summary::-webkit-details-marker { display: none; }
.api-entry > summary::after { content: "+"; color: var(--subtle); font-size: 20px; font-weight: 400; }
.api-entry[open] > summary::after { content: "−"; }
.api-signature { overflow: hidden; color: var(--brand-strong); font: 13px/1.55 ui-monospace, SFMono-Regular, Consolas, monospace; text-overflow: ellipsis; white-space: nowrap; }
.api-name { grid-column: 1; color: var(--muted); font-size: 12px; }
.api-body { border-top: 1px solid var(--border); padding: 3px 16px 17px; }
.api-description { color: var(--text); }
.meta-label { margin: 16px 0 7px; color: var(--subtle); font-size: 11px; font-weight: 750; letter-spacing: .07em; text-transform: uppercase; }
.param-table { margin-top: 7px; }
.return-value { color: var(--muted); }
.return-value code { color: var(--success); }
.api-empty { display: none; padding: 24px; color: var(--muted); text-align: center; }
.faq { border-top: 1px solid var(--border); padding: 15px 0; }
.faq h3 { margin-top: 0; }
.toast { position: fixed; z-index: 80; bottom: 24px; left: 50%; transform: translate(-50%, 16px); border-radius: 999px; padding: 8px 16px; color: #fff; background: #0f172a; opacity: 0; pointer-events: none; transition: .18s ease; font-size: 12px; }
.toast.show { transform: translate(-50%, 0); opacity: 1; }
.nav-overlay { display: none; }
.page-footer { margin-top: 54px; border-top: 1px solid var(--border); padding-top: 18px; color: var(--subtle); font-size: 12px; }
@media (max-width: 900px) {
  .topbar { gap: 9px; padding: 0 12px; }
  .menu-button { display: grid; }
  .brand span:not(.brand-mark) { display: none; }
  .version, .github-link, .shortcut { display: none; }
  .search { width: auto; flex: 1; margin: 0; }
  .search input { padding-right: 12px; }
  .sidebar { transform: translateX(-100%); transition: transform .2s ease; box-shadow: var(--shadow); }
  body.nav-open .sidebar { transform: translateX(0); }
  .nav-overlay { position: fixed; z-index: 35; inset: var(--header-height) 0 0; background: rgba(15, 23, 42, .42); }
  body.nav-open .nav-overlay { display: block; }
  .content { width: 100%; margin-left: 0; padding: 24px 20px 70px; }
}
@media (max-width: 620px) {
  .content { padding-inline: 15px; }
  .card-grid, .api-jump { grid-template-columns: 1fr; }
  .api-toolbar { align-items: stretch; flex-direction: column; }
  .api-entry > summary { padding: 12px; }
  .api-body { padding-inline: 12px; }
  table { display: block; overflow-x: auto; white-space: nowrap; }
}
@media print {
  .topbar, .sidebar, .nav-overlay, .api-toolbar, .copy-button { display: none !important; }
  .shell { padding-top: 0; }
  .content { width: 100%; max-width: none; margin: 0; padding: 0; }
  .page { display: block; break-before: page; }
  .api-entry { break-inside: avoid; }
}
</style>
</head>
<body>
<header class="topbar">
  <button class="menu-button" id="menuButton" type="button" aria-label="打开导航" aria-controls="sidebar" aria-expanded="false">☰</button>
  <a class="brand" href="#/quickstart"><span class="brand-mark">AS</span><span>AutoSDK 文档</span><small class="version">v{{VERSION}}</small></a>
  <div class="search">
    <span class="search-icon" aria-hidden="true">⌕</span>
    <input id="globalSearch" type="search" placeholder="搜索 API、模块或问题…" autocomplete="off" aria-label="搜索文档" aria-controls="searchResults" aria-expanded="false">
    <span class="shortcut">/</span>
    <div class="search-results" id="searchResults" role="listbox"></div>
  </div>
  <div class="top-actions">
    <button class="icon-button" id="themeButton" type="button" aria-label="切换明暗主题">◐</button>
    <a class="github-link" href="https://github.com/huihui0115/ios-auto-sdk" target="_blank" rel="noreferrer">GitHub</a>
  </div>
</header>
<div class="shell">
  <aside class="sidebar" id="sidebar" aria-label="开发文档导航">{{SIDEBAR}}</aside>
  <div class="nav-overlay" id="navOverlay"></div>
  <main class="content" id="main" tabindex="-1">
    <div class="breadcrumb"><span id="crumbGroup">入门</span><span id="crumbPage">5 分钟上手</span></div>
    {{CONTENT}}
    <footer class="page-footer">AutoSDK v{{VERSION}} · {{API_COUNT}} 个 API 条目 · 离线可用 · 内容由仓库元数据生成</footer>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite">已复制</div>
<script>
const INDEX = {{SEARCH_INDEX}};
const pages = Array.from(document.querySelectorAll('.page'));
const navLinks = Array.from(document.querySelectorAll('.nav-link'));
const search = document.getElementById('globalSearch');
const searchResults = document.getElementById('searchResults');
const menuButton = document.getElementById('menuButton');
let activeSearchIndex = -1;

function textEscape(value) {
  return String(value).replace(/[&<>"']/g, function (char) {
    return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char];
  });
}

function closeNavigation() {
  document.body.classList.remove('nav-open');
  menuButton.setAttribute('aria-expanded', 'false');
}

function showPage(pageId, anchor) {
  let page = document.getElementById('page-' + pageId);
  if (!page) {
    pageId = 'quickstart';
    page = document.getElementById('page-quickstart');
  }
  pages.forEach(function (candidate) { candidate.classList.toggle('current', candidate === page); });
  navLinks.forEach(function (link) { link.classList.toggle('current', link.dataset.page === pageId); });
  document.getElementById('crumbGroup').textContent = page.dataset.group;
  document.getElementById('crumbPage').textContent = page.dataset.title;
  document.title = page.dataset.title + ' · AutoSDK 开发文档';
  closeNavigation();
  if (anchor) {
    const target = document.getElementById(anchor);
    if (target && target.tagName === 'DETAILS') target.open = true;
    requestAnimationFrame(function () {
      if (target) target.scrollIntoView({ block: 'start' });
    });
  } else {
    window.scrollTo(0, 0);
  }
}

function route() {
  const path = decodeURIComponent(location.hash.replace(/^#\//, '')) || 'quickstart';
  const parts = path.split('/');
  showPage(parts[0], parts[1] || '');
}

function renderSearch() {
  const query = search.value.trim().toLowerCase();
  activeSearchIndex = -1;
  if (!query) {
    searchResults.classList.remove('open');
    search.setAttribute('aria-expanded', 'false');
    return;
  }
  const tokens = query.split(/\s+/).filter(Boolean);
  const hits = INDEX.filter(function (item) {
    const source = item.search.toLowerCase();
    return tokens.every(function (token) { return source.includes(token); });
  }).slice(0, 18);
  searchResults.innerHTML = hits.length ? hits.map(function (item, index) {
    return '<a class="search-result" data-search-index="' + index + '" href="' + item.href + '" role="option">' +
      '<strong>' + textEscape(item.title) + '</strong><span>' + textEscape(item.meta) + '</span></a>';
  }).join('') : '<div class="search-empty">没有匹配结果，试试模块名或函数名</div>';
  searchResults.classList.add('open');
  search.setAttribute('aria-expanded', 'true');
}

function selectSearchResult(next) {
  const results = Array.from(searchResults.querySelectorAll('.search-result'));
  if (!results.length) return;
  activeSearchIndex = (next + results.length) % results.length;
  results.forEach(function (result, index) { result.classList.toggle('active', index === activeSearchIndex); });
  results[activeSearchIndex].scrollIntoView({ block: 'nearest' });
}

async function copyText(value) {
  if (navigator.clipboard && window.isSecureContext) {
    try { await navigator.clipboard.writeText(value); return true; } catch (_) {}
  }
  const area = document.createElement('textarea');
  area.value = value;
  area.setAttribute('readonly', '');
  area.style.position = 'fixed';
  area.style.opacity = '0';
  document.body.appendChild(area);
  area.select();
  let copied = false;
  try { copied = document.execCommand('copy'); } catch (_) {}
  area.remove();
  return copied;
}

function showToast(message) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('show');
  setTimeout(function () { toast.classList.remove('show'); }, 1200);
}

document.addEventListener('click', async function (event) {
  const copy = event.target.closest('[data-copy]');
  if (copy) {
    const source = document.getElementById(copy.dataset.copy);
    const copied = source && await copyText(source.textContent);
    showToast(copied ? '已复制到剪贴板' : '复制失败，请手动选择');
    return;
  }
  if (!event.target.closest('.search')) {
    searchResults.classList.remove('open');
    search.setAttribute('aria-expanded', 'false');
  }
});

search.addEventListener('input', renderSearch);
search.addEventListener('keydown', function (event) {
  if (event.key === 'ArrowDown') { event.preventDefault(); selectSearchResult(activeSearchIndex + 1); }
  if (event.key === 'ArrowUp') { event.preventDefault(); selectSearchResult(activeSearchIndex - 1); }
  if (event.key === 'Enter' && activeSearchIndex >= 0) {
    const result = searchResults.querySelector('[data-search-index="' + activeSearchIndex + '"]');
    if (result) { event.preventDefault(); result.click(); }
  }
  if (event.key === 'Escape') {
    search.value = '';
    renderSearch();
    search.blur();
  }
});
searchResults.addEventListener('click', function () {
  search.value = '';
  searchResults.classList.remove('open');
});
document.addEventListener('keydown', function (event) {
  if (event.key === '/' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) {
    event.preventDefault();
    search.focus();
  }
});

document.querySelectorAll('.api-filter').forEach(function (input) {
  input.addEventListener('input', function () {
    const page = input.closest('.page');
    const query = input.value.trim().toLowerCase();
    let visible = 0;
    page.querySelectorAll('.api-entry').forEach(function (entry) {
      const match = !query || entry.dataset.filter.includes(query);
      entry.hidden = !match;
      if (match) visible += 1;
    });
    page.querySelectorAll('.api-jump a').forEach(function (link) {
      link.hidden = Boolean(query) && !link.dataset.filter.includes(query);
    });
    page.querySelector('.api-visible-count').textContent = String(visible);
    page.querySelector('.api-empty').style.display = visible ? 'none' : 'block';
  });
});
document.querySelectorAll('[data-expand]').forEach(function (button) {
  button.addEventListener('click', function () {
    const entries = Array.from(button.closest('.page').querySelectorAll('.api-entry:not([hidden])'));
    const shouldOpen = entries.some(function (entry) { return !entry.open; });
    entries.forEach(function (entry) { entry.open = shouldOpen; });
    button.textContent = shouldOpen ? '全部收起' : '全部展开';
  });
});

menuButton.addEventListener('click', function () {
  const open = document.body.classList.toggle('nav-open');
  menuButton.setAttribute('aria-expanded', String(open));
});
document.getElementById('navOverlay').addEventListener('click', closeNavigation);
document.getElementById('themeButton').addEventListener('click', function () {
  const theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = theme;
  try { localStorage.setItem('autosdk-docs-theme', theme); } catch (_) {}
});
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
