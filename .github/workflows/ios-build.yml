name: Build TrollStore IPA

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      requestId:
        description: "Optional client request ID for matching downloaded artifacts"
        required: false
        type: string

run-name: AutoSDK TrollStore IPA (${{ inputs.requestId || github.run_id }})

concurrency:
  group: autosdk-ios-${{ github.event_name == 'workflow_dispatch' && (inputs.requestId || github.run_id) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate package and developer tools
        run: |
          swift package dump-package >/dev/null
          npm run verify
          npm test
          npm ci --prefix vscode-extension
          npm run check --prefix vscode-extension
          npm test --prefix vscode-extension
          ./vscode-extension/node_modules/.bin/tsc -p jsconfig.json --noEmit
          plutil -lint Examples/TemplateApp/App/Info.plist
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate template project
        working-directory: Examples/TemplateApp
        run: xcodegen generate
      - name: Run iOS simulator tests
        timeout-minutes: 20
        run: |
          destination_id="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(device["udid"] for runtime in data["devices"].values() for device in runtime if device.get("isAvailable") and device.get("name", "").startswith("iPhone")))')"
          test -n "$destination_id"
          xcodebuild test \
            -project Examples/TemplateApp/AutoSDKTemplate.xcodeproj \
            -scheme AutoSDKTemplate \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$destination_id" \
            -derivedDataPath "$RUNNER_TEMP/autosdk-tests" \
            -resultBundlePath "$RUNNER_TEMP/AutoSDKTests.xcresult" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO
      - name: Print test diagnostics
        if: failure()
        run: |
          result="$RUNNER_TEMP/AutoSDKTests.xcresult"
          summary="$RUNNER_TEMP/AutoSDKTests.json"
          diagnostics="$RUNNER_TEMP/AutoSDKTestDiagnostics"
          test -d "$result"
          xcrun xcresulttool get --path "$result" --format json > "$summary"
          echo "Failure messages:"
          jq -r '.. | objects | .message?._value? // empty' "$summary" | sort -u | head -200
          mkdir -p "$diagnostics"
          jq -r '.. | objects | .diagnosticsRef?.id?._value? // empty' "$summary" | sort -u |
          while IFS= read -r reference; do
            test -n "$reference" || continue
            output="$diagnostics/$reference"
            xcrun xcresulttool export --path "$result" --id "$reference" \
              --type directory --output-path "$output" || true
          done
          find "$diagnostics" -type f \( -name '*.crash' -o -name '*.ips' -o -name '*.txt' \) -print |
          sort | head -20 |
          while IFS= read -r report; do
            echo "::group::Crash diagnostic: $report"
            sed -n '1,260p' "$report"
            echo "::endgroup::"
          done
      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AutoSDKTests-xcresult
          path: ${{ runner.temp }}/AutoSDKTests.xcresult
          if-no-files-found: warn
      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project Examples/TemplateApp/AutoSDKTemplate.xcodeproj \
            -scheme AutoSDKTemplate \
            -sdk iphoneos \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/autosdk-derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/autosdk-derived/Build/Products/Debug-iphoneos/AutoSDKTemplate.app"
          test -d "$app"
          rm -rf dist
          mkdir -p dist/Payload
          cp -R "$app" dist/Payload/AutoSDKTemplate.app
          (cd dist && zip -qry AutoSDKTemplate.ipa Payload)
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoSDKTemplate-TrollStore
          path: dist/AutoSDKTemplate.ipa
          if-no-files-found: error

      - name: Publish GitHub Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          notes="$RUNNER_TEMP/release-notes.md"
          { echo "AutoSDK ${tag} unsigned TrollStore IPA."; echo ""; echo "See CHANGELOG.md for release notes."; } > "$notes"
          gh release create "$tag" \
            --title "AutoSDK ${tag}" \
            --notes-file "$notes" \
            dist/AutoSDKTemplate.ipa \
            || gh release edit "$tag" --notes-file "$notes" --title "AutoSDK ${tag}"
